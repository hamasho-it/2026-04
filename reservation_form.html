<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus-Fit - 予約フォーム</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="./index.html">&lt; ホーム画面に戻る</a>
        </div>

        <div class="content">
            <h2 class="page-title">予約フォーム</h2>

            <form id="reservation-form" style="display: flex; flex-direction: column; gap: 16px; margin-top: 10px;">
                <div class="form-group">
                    <label for="pickup">乗り場選択</label>
                    <select id="pickup" required>
                        <option value="サンプル浜田駅" selected>サンプル浜田駅 ∨</option>
                        <option value="サンプル琵琶町">サンプル琵琶町 ∨</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dropoff">降り場選択</label>
                    <select id="dropoff" required>
                        <option value="サンプル市役所前" selected>サンプル市役所前 ∨</option>
                        <option value="サンプル田町">サンプル田町 ∨</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="time">時間を選択</label>
                    <select id="time" required>
                        <option value="08:30" selected>08:30 発 ∨</option>
                        <option value="09:15">09:15 発 ∨</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="seat">座席を選択</label>
                    <select id="seat" required>
                        <option value="1A" selected>1A (窓側) ∨</option>
                        <option value="1B">1B (通路側) ∨</option>
                    </select>
                </div>

                <div style="margin-top: 20px;">
                    <button type="submit" class="btn btn-primary btn-large">決定</button>
                </div>
            </form>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
